site_name: Hands-On Agentic AI Workshop
repo_url: https://github.com/acceleratescience/hands-on-agentic-ai
site_url: https://docs.science.ai.cam.ac.uk/hands-on-agentic-ai/

nav:
  - Home:
      - Welcome!: index.md
      - License: Home/LICENSE.md
      - About us: Home/about.md

  - Setting up:
      - Overview: setting-up/overview.md
      - Codespaces: setting-up/codespaces.md
      - Runpod: setting-up/runpod.md
      - Nvidia NIMs: setting-up/nvidia.md
      - Azure AI Studio: setting-up/azure.md
      - Running locally: setting-up/running-locally.md

  - The OpenAI API:
      - Introduction: 2_open_ai.ipynb
      - Tools: tools/tools.ipynb

  - Prompting:
      - Overview: prompting/index.md
      - Prompt Engineering: prompting/3_prompting.ipynb
      - Prompt Templates: prompting/4_prompt_templates.ipynb
      - Generating abstracts: prompting/prompting_exercise.ipynb

  - Pydantic: 5_pydantic.ipynb

  - States & Storage:
      - Overview: states/index.md
      - Tracking Basic Information: states/6_states.ipynb
      - Running Summary: states/7_summary.ipynb
      - Data Storage: states/8_data_storage.ipynb

  - Streamlit:
      - Overview: streamlit/index.md
      - Introduction to Streamlit: streamlit/streamlit.md

  - RAG:
      - Ingestion: data-storage-and-ingestion/9_documents.ipynb

  - Evaluation: evaluation/10_evaluation.ipynb

  - Fine Tuning:
      - Overview: finetuning/index.md
      - OpenAI Fine Tuning: finetuning/openai-finetuning.ipynb

extra_css:
  - css/custom.css

theme:
  favicon: imgs/trace.svg
  name: material
  custom_dir: overrides
  logo: imgs/trace.svg

  features:
    - toc.integrate
    - search.suggest
    - search.highlight
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.share
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    annotation: material/chevron-right-circle

plugins:
  - mkdocstrings
  - search
  - mkdocs-jupyter

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  homepage: https://docs.science.ai.cam.ac.uk/

  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
      - manage

  analytics:
    provider: google
    property: G-JLGLYJ24SD

    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/acceleratescience/hands-on-agentic-ai/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.

        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://github.com/acceleratescience/hands-on-agentic-ai/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">feedback form</a>.

copyright: >
  Copyright &copy; 2024–2026 Accelerate Programme for Scientific Discovery –
  <a href="#__consent">Change cookie settings</a>

watch:
  - .